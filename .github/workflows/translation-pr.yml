name: Translation PR validation

# Gate Crowdin's `l10n_published → published` PRs (and any other PR
# touching i18n/**) on a real Docusaurus build. The bad translation
# stays on the service branch until a human fixes it in Crowdin.
#
# See .claude/skills/notion-markdown-export/translations-decision.md §13.

on:
  pull_request:
    branches: [published]
    paths:
      - "i18n/**"
      - "docs/**"
      - "src/plugins/canonical-slugs/**"
      - "src/theme/**"

concurrency:
  group: translation-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "pnpm"

      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Vitest
        run: pnpm test

      - name: Docusaurus build
        run: pnpm build
        env:
          # Preview build — keep search engines from indexing.
          IS_PRODUCTION: "false"
